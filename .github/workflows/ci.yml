name: GestureSign regression CI

on:
  push:
  pull_request:

jobs:
  regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore GestureSign.sln -p:RestoreLockedMode=false
      - name: Build complete solution (including legacy updater)
        shell: pwsh
        run: |
          dotnet build GestureSign.sln -c Release --no-restore -p:Platform=x64 *> solution-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content solution-build.log; exit $LASTEXITCODE }
      - name: Build x64 daemon and WinUI
        run: |
          dotnet build GestureSign.Daemon/GestureSign.Daemon.csproj -c Release --no-restore -p:PlatformTarget=x64 *> daemon-x64-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content daemon-x64-build.log; exit $LASTEXITCODE }
          dotnet build GestureSign.WinUI/GestureSign.WinUI.csproj -c Release --no-restore -p:Platform=x64 -p:PlatformTarget=x64 *> winui-x64-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content winui-x64-build.log; exit $LASTEXITCODE }
      - name: Run regression tests
        run: dotnet run --project tests/GestureSign.RegressionTests/GestureSign.RegressionTests.csproj -c Release
      - name: Run TipTap state machine tests
        run: dotnet run --project tests/GestureSign.TipTapTests/GestureSign.TipTapTests.csproj -c Release
      - name: Test native edge-click ownership
        run: dotnet run --project tests/GestureSign.EdgeClickTests/GestureSign.EdgeClickTests.csproj -c Release
      - name: Test optional local intent learning and daemon bridge
        run: |
          dotnet run --project tests/GestureSign.IntentTests/GestureSign.IntentTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/GestureSign.IntentBridgeTests/GestureSign.IntentBridgeTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/GestureSign.IntentPackageTests/GestureSign.IntentPackageTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/GestureSign.IntentHostTests/GestureSign.IntentHostTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) {
            $hostTestExit = $LASTEXITCODE
            if (Test-Path intent-host-failure.log) { Get-Content intent-host-failure.log }
            exit $hostTestExit
          }
          dotnet build GestureSign.IntentDlc/GestureSign.IntentDlc.csproj -c Release -p:IntentBackend=Hardware
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet GestureSign.IntentDlc/bin/Release/net10.0-windows10.0.26100.0/win-x64/GestureSign.IntentDlc.dll --self-test intent-runtime-test.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test gesture correction and shared localization
        shell: pwsh
        run: |
          dotnet run --project tests/GestureSign.GestureCorrectionTests/GestureSign.GestureCorrectionTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/GestureSign.LocalizationTests/GestureSign.LocalizationTests.csproj -c Release -- .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build and validate slim AI packages
        shell: pwsh
        run: |
          ./installer/Build-IntentCatalog.ps1 -OutputDirectory ./publish/intent
          foreach ($architecture in @('x64', 'arm64')) {
            foreach ($backend in @('Cpu', 'Hardware')) {
              ./tools/Test-IntentPackage.ps1 -PackagePath "./publish/intent/GestureSign-IntentDlc-18.3.2-$($backend.ToLowerInvariant())-win-$architecture.zip" -Backend $backend
            }
          }
          $engine = Start-Process ./publish/intent/x64-Cpu/Runtime/GestureSign.IntentDlc.exe -ArgumentList @('--self-test', "$env:RUNNER_TEMP/intent-cpu-test.json") -WindowStyle Hidden -PassThru -Wait
          if ($engine.ExitCode -ne 0) { throw 'Published CPU engine self-test failed.' }
      - name: Compile ARM64 daemon and WinUI
        run: |
          dotnet restore GestureSign.Daemon/GestureSign.Daemon.csproj -p:RuntimeIdentifier=win-arm64 -p:RestoreLockedMode=false
          dotnet restore GestureSign.WinUI/GestureSign.WinUI.csproj -p:RuntimeIdentifier=win-arm64 -p:RestoreLockedMode=false
          dotnet build GestureSign.Daemon/GestureSign.Daemon.csproj -c Release --no-restore -p:Platform=ARM64 -p:PlatformTarget=ARM64 -p:RuntimeIdentifier=win-arm64 -warnaserror *> daemon-arm64-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content daemon-arm64-build.log; exit $LASTEXITCODE }
          dotnet build GestureSign.WinUI/GestureSign.WinUI.csproj -c Release --no-restore -p:Platform=ARM64 -p:PlatformTarget=ARM64 -p:RuntimeIdentifier=win-arm64 -warnaserror *> winui-arm64-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content winui-arm64-build.log; exit $LASTEXITCODE }
      - name: Verify ARM64 backend dependency architecture
        shell: pwsh
        run: ./tools/Test-BackendArchitecture.ps1 -PackagePath ./GestureSign.Daemon/bin/ARM64/Release/net10.0-windows10.0.19041.0/win-arm64 -Architecture ARM64
      - name: Enforce warning baseline
        shell: pwsh
        # ARM64 reference-assembly diagnostics (CS8012) depend on the SDK's
        # cross-target restore graph; the supported warning gate is the clean
        # x64 solution build above.
        run: ./tools/Test-WarningBaseline.ps1 -LogPath solution-build.log
      - name: Build portable payload
        shell: pwsh
        run: |
          pwsh -NoProfile -File ./installer/Build-GestureSignV2-KandoMsi.ps1 -PublishDir ./publish/portable -PayloadOnly
      - name: Test configuration archive roundtrip and daemon startup
        shell: pwsh
        run: |
          dotnet run --project tests/GestureSign.InputPolicyTests/GestureSign.InputPolicyTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/GestureSign.ConfigArchiveTests/GestureSign.ConfigArchiveTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/Test-DaemonStartup.ps1 -Executable ./publish/portable/Backend/GestureSign.exe
      - name: Validate portable payload
        shell: pwsh
        run: ./tools/Test-PortablePackage.ps1 -PackagePath ./publish/portable -MinimumFileCount 200
