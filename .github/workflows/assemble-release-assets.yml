name: Assemble release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag containing the uploaded parts
        required: true
        type: string
      msi_name:
        description: Final MSI asset name
        required: true
        type: string
      msi_sha256:
        description: Expected MSI SHA-256
        required: true
        type: string
      portable_name:
        description: Final portable ZIP asset name
        required: true
        type: string
      portable_sha256:
        description: Expected portable ZIP SHA-256
        required: true
        type: string

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
      MSI_NAME: ${{ inputs.msi_name }}
      MSI_SHA256: ${{ inputs.msi_sha256 }}
      PORTABLE_NAME: ${{ inputs.portable_name }}
      PORTABLE_SHA256: ${{ inputs.portable_sha256 }}
    steps:
      - name: Download, verify, and publish assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p parts output
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$MSI_NAME.part-*" --pattern "$PORTABLE_NAME.part-*" --dir parts

          mapfile -t msi_parts < <(find parts -maxdepth 1 -type f -name "$MSI_NAME.part-*" | sort)
          mapfile -t portable_parts < <(find parts -maxdepth 1 -type f -name "$PORTABLE_NAME.part-*" | sort)
          test "${#msi_parts[@]}" -gt 0
          test "${#portable_parts[@]}" -gt 0

          cat "${msi_parts[@]}" > "output/$MSI_NAME"
          cat "${portable_parts[@]}" > "output/$PORTABLE_NAME"
          echo "$MSI_SHA256  output/$MSI_NAME" | sha256sum --check --strict
          echo "$PORTABLE_SHA256  output/$PORTABLE_NAME" | sha256sum --check --strict

          gh release upload "$TAG" "output/$MSI_NAME" "output/$PORTABLE_NAME" --repo "$GITHUB_REPOSITORY" --clobber
          for part in "${msi_parts[@]}" "${portable_parts[@]}"; do
            gh release delete-asset "$TAG" "$(basename "$part")" --repo "$GITHUB_REPOSITORY" --yes
          done
